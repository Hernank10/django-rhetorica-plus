{% extends "core/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white"><h4><i class="fas fa-file-alt"></i> Configurar examen</h4></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3"><label>Temática</label><select name="tema" class="form-select"><option value="retorica">Retórica - Figuras</option><option value="etimologia">Etimología - Raíces</option></select></div>
                    <div class="mb-3"><label>Número de preguntas</label><input type="number" name="num_preguntas" class="form-control" value="10" min="5" max="50"></div>
                    <button type="submit" class="btn btn-success w-100">Generar examen</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
