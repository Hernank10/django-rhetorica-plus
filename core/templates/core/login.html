{% extends 'core/base.html' %}
{% load static %}

{% block title %}Iniciar Sesión - Rhetorica Plus{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 shadow">
            <div class="text-center mb-4">
                <i class="fas fa-scroll fa-3x" style="color: var(--gold);"></i>
                <h2 class="mt-2" style="color: var(--primary);">Rhetorica Plus</h2>
                <p class="text-muted">Inicia sesión para continuar</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="fas fa-user me-1"></i> Usuario
                    </label>
                    <input type="text" class="form-control" id="username" name="username" 
                           placeholder="Ingresa tu usuario" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock me-1"></i> Contraseña
                    </label>
                    <input type="password" class="form-control" id="password" name="password" 
                           placeholder="Ingresa tu contraseña" required>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-gold">
                        <i class="fas fa-sign-in-alt me-1"></i> Iniciar Sesión
                    </button>
                </div>
            </form>
            
            <hr class="my-4">
            
            <div class="text-center">
                <p class="mb-2">
                    <a href="{% url 'core:recuperar_contrasena' %}" class="text-decoration-none">
                        <i class="fas fa-key me-1"></i> ¿Olvidaste tu contraseña?
                    </a>
                </p>
                <p class="mb-0">
                    ¿No tienes cuenta? 
                    <a href="{% url 'core:registro' %}" class="text-decoration-none fw-bold" style="color: var(--gold);">
                        <i class="fas fa-user-plus me-1"></i> Regístrate aquí
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
